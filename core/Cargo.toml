[package]
name = "minimapprint-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "pic2gray4px 2x2-cell pattern-dither conversion core, ported to WebAssembly for MiniMapPrint"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "=0.25.10", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
